pre-commit:
  jobs:
    - name: eslint
      glob: "*.{ts,tsx,js,jsx}"
      run: bunx eslint --fix {staged_files}
      stage_fixed: true
    - name: prettier
      glob: "*.{ts,tsx,js,jsx,json,md}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true
    - name: backend-tests
      run: bun run --filter @bookee/backend test
