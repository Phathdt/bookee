openapi: 3.0.0
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponseDto'
      summary: Liveness probe — returns ok when the API process is up
      tags:
        - health
  /api/v1/auth/register:
    post:
      operationId: registerUser
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBodyDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionDto'
      summary: Create a new customer account
      tags:
        - auth
  /api/v1/auth/login:
    post:
      operationId: loginUser
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBodyDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionDto'
      summary: Authenticate by phone/email + password
      tags:
        - auth
  /api/v1/auth/refresh:
    post:
      operationId: refreshTokens
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshBodyDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensDto'
      summary: Exchange refresh token for new pair
      tags:
        - auth
  /api/v1/users/me:
    get:
      operationId: getMe
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserDto'
      security:
        - bearer: []
      summary: Return the authenticated user profile
      tags:
        - users
    patch:
      operationId: updateMe
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileBodyDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserDto'
      security:
        - bearer: []
      summary: Update the authenticated user profile
      tags:
        - users
  /api/v1/operators:
    get:
      operationId: listOperators
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperatorDto'
      summary: List active operators (public)
      tags:
        - operators
    post:
      operationId: createOperator
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOperatorBodyDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorDto'
      security:
        - bearer: []
      summary: Create a new operator (admin only)
      tags:
        - operators
  /api/v1/operators/all:
    get:
      operationId: listAllOperators
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperatorDto'
      security:
        - bearer: []
      summary: List every operator (admin only)
      tags:
        - operators
  /api/v1/operators/{id}:
    get:
      operationId: getOperator
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorDto'
      summary: Get a single operator by id
      tags:
        - operators
    patch:
      operationId: updateOperator
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOperatorBodyDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorDto'
      security:
        - bearer: []
      summary: Update operator metadata (admin only)
      tags:
        - operators
    delete:
      operationId: deleteOperator
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '204':
          description: ''
      security:
        - bearer: []
      summary: Delete operator (admin only)
      tags:
        - operators
  /api/v1/operators/{id}/status:
    patch:
      operationId: setOperatorStatus
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetOperatorStatusBodyDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorDto'
      security:
        - bearer: []
      summary: Activate / suspend an operator (admin only)
      tags:
        - operators
  /api/v1/operators/{id}/staff:
    post:
      operationId: assignOperatorStaff
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignStaffBodyDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStaffUserDto'
      security:
        - bearer: []
      summary: Assign a user (role operator|driver) to an operator
      tags:
        - operators
info:
  title: Bookee API
  description: Multi-operator trip booking platform API
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    HealthResponseDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
      required:
        - status
      description: Liveness probe response — status is always "ok" when up
    RegisterBodyDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          minLength: 8
          maxLength: 20
          pattern: ^[+\d\s-]+$
        email:
          type: string
          maxLength: 254
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        password:
          type: string
          minLength: 8
          maxLength: 72
      required:
        - name
        - phone
        - email
        - password
    AuthSessionDto:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            name:
              type: string
            phone:
              type: string
            email:
              type: string
              format: email
              pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
            role:
              type: string
              enum:
                - customer
                - operator
                - driver
                - admin
            operatorId:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
              nullable: true
          required:
            - id
            - name
            - phone
            - email
            - role
            - operatorId
        tokens:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
          required:
            - accessToken
            - refreshToken
      required:
        - user
        - tokens
    LoginBodyDto:
      type: object
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 254
          description: phone OR email
        password:
          type: string
          minLength: 8
          maxLength: 72
      required:
        - identifier
        - password
    RefreshBodyDto:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
        - refreshToken
    AuthTokensDto:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
      required:
        - accessToken
        - refreshToken
    PublicUserDto:
      type: object
      properties:
        id:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        role:
          type: string
          enum:
            - customer
            - operator
            - driver
            - admin
        operatorId:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - phone
        - email
        - role
        - operatorId
        - createdAt
        - updatedAt
    UpdateProfileBodyDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          minLength: 8
          maxLength: 20
          pattern: ^[+\d\s-]+$
        email:
          type: string
          maxLength: 254
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
    OperatorDto:
      type: object
      properties:
        id:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        name:
          type: string
        hotline:
          type: string
        logo:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - pending
            - active
            - suspended
      required:
        - id
        - name
        - hotline
        - logo
        - status
    CreateOperatorBodyDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        hotline:
          type: string
          minLength: 8
          maxLength: 20
          pattern: ^[+\d\s-]+$
        logo:
          type: string
          maxLength: 500
          format: uri
      required:
        - name
        - hotline
    UpdateOperatorBodyDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        hotline:
          type: string
          minLength: 8
          maxLength: 20
        logo:
          type: string
          maxLength: 500
          format: uri
          nullable: true
    SetOperatorStatusBodyDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - pending
            - active
            - suspended
      required:
        - status
    AssignStaffBodyDto:
      type: object
      properties:
        userId:
          type: integer
          exclusiveMinimum: true
          maximum: 9007199254740991
          minimum: 0
        role:
          type: string
          enum:
            - operator
            - driver
      required:
        - userId
        - role
    PublicStaffUserDto:
      type: object
      properties:
        id:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        role:
          type: string
          enum:
            - customer
            - operator
            - driver
            - admin
        operatorId:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - phone
        - email
        - role
        - operatorId
        - createdAt
        - updatedAt
