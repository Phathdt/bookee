            minLength: 1
            maxLength: 120
            type: string
        - name: to
          required: true
          in: query
          schema:
            minLength: 1
            maxLength: 120
            type: string
        - name: date
          required: true
          in: query
          schema:
            pattern: ^\d{4}-\d{2}-\d{2}$
            type: string
        - name: operatorId
          required: false
          in: query
          schema:
            type: array
            items:
              type: integer
              exclusiveMinimum: true
              maximum: 9007199254740991
              minimum: 0
        - name: vehicleType
          required: false
          in: query
          schema:
            minLength: 1
            type: string
        - name: priceMin
          required: false
          in: query
          schema:
            minimum: 0
            maximum: 9007199254740991
            type: integer
        - name: priceMax
          required: false
          in: query
          schema:
            minimum: 0
            maximum: 9007199254740991
            type: integer
        - name: sort
          required: false
          in: query
          schema:
            default: departureTime
            type: string
            enum:
              - departureTime
              - price
              - duration
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 50
            default: 20
            type: integer
        - name: cursor
          required: false
          in: query
          schema:
            type: string
