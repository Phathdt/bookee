  /api/v1/vehicles:
    get:
      operationId: listVehicles
      parameters:
        - name: companyId
          required: false
          in: query
          schema:
            maximum: 9007199254740991
            exclusiveMinimum: true
            type: integer
            minimum: 0
        - name: type
          required: false
          in: query
          schema:
            minLength: 1
            maxLength: 50
            type: string
      responses:
