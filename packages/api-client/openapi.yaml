            maximum: 9007199254740991
            exclusiveMinimum: true
            type: integer
            minimum: 0
        - name: status
          required: false
          in: query
          schema:
            type: string
            enum:
              - scheduled
              - in_progress
              - completed
              - cancelled
        - name: from
          required: false
          in: query
          schema:
            format: date-time
            pattern: >-
              ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            type: string
        - name: to
          required: false
          in: query
          schema:
            format: date-time
            pattern: >-
