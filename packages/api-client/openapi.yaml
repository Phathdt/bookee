info:
  title: Bookee API
  description: Multi-operator trip booking platform API
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    HealthResponseDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
      required:
        - status
      description: Liveness probe response — status is always "ok" when up
    RegisterBodyDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          minLength: 8
          maxLength: 20
          pattern: ^[+\d\s-]+$
        email:
          type: string
          maxLength: 254
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        password:
          type: string
          minLength: 8
          maxLength: 72
      required:
        - name
        - phone
        - email
        - password
    AuthSessionDto:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            name:
              type: string
            phone:
              type: string
            email:
              type: string
              format: email
              pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
            role:
              type: string
              enum:
                - customer
                - operator
                - driver
                - admin
            operatorId:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
              nullable: true
          required:
            - id
            - name
            - phone
            - email
            - role
            - operatorId
        tokens:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
          required:
            - accessToken
            - refreshToken
      required:
        - user
        - tokens
    LoginBodyDto:
      type: object
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 254
          description: phone OR email
        password:
          type: string
          minLength: 8
          maxLength: 72
      required:
        - identifier
        - password
    RefreshBodyDto:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
        - refreshToken
    AuthTokensDto:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
      required:
        - accessToken
        - refreshToken
    PublicUserDto:
      type: object
      properties:
        id:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        role:
          type: string
          enum:
            - customer
            - operator
            - driver
            - admin
        operatorId:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - phone
        - email
        - role
        - operatorId
        - createdAt
        - updatedAt
    UpdateProfileBodyDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          minLength: 8
          maxLength: 20
          pattern: ^[+\d\s-]+$
        email:
          type: string
          maxLength: 254
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
    OperatorDto:
      type: object
      properties:
        id:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        name:
          type: string
        hotline:
          type: string
        logo:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - pending
            - active
            - suspended
      required:
        - id
        - name
        - hotline
        - logo
        - status
    CreateOperatorBodyDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        hotline:
          type: string
          minLength: 8
          maxLength: 20
          pattern: ^[+\d\s-]+$
        logo:
          type: string
          maxLength: 500
          format: uri
      required:
        - name
        - hotline
    UpdateOperatorBodyDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        hotline:
          type: string
          minLength: 8
          maxLength: 20
        logo:
          type: string
          maxLength: 500
          format: uri
          nullable: true
    SetOperatorStatusBodyDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - pending
            - active
            - suspended
      required:
        - status
    AssignStaffBodyDto:
      type: object
      properties:
        userId:
          type: integer
          exclusiveMinimum: true
          maximum: 9007199254740991
          minimum: 0
        role:
          type: string
          enum:
            - operator
            - driver
      required:
        - userId
        - role
    PublicStaffUserDto:
      type: object
      properties:
        id:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        role:
          type: string
          enum:
            - customer
            - operator
            - driver
            - admin
        operatorId:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - phone
        - email
        - role
        - operatorId
        - createdAt
        - updatedAt
    SeatLayoutDto:
      type: object
      properties:
        id:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        name:
          type: string
        rows:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        cols:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        seats:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
              layoutId:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
              code:
                type: string
              floor:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
              row:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
              col:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
            required:
              - id
              - layoutId
              - code
              - floor
              - row
              - col
      required:
        - id
        - name
        - rows
        - cols
    CreateSeatLayoutBodyDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        rows:
          type: integer
          exclusiveMinimum: true
          maximum: 9007199254740991
          minimum: 0
        cols:
          type: integer
          exclusiveMinimum: true
          maximum: 9007199254740991
          minimum: 0
        seats:
          minItems: 1
          type: array
          items:
            type: object
            properties:
