        - payments
  /api/v1/payments/{id}/confirm:
    post:
      operationId: manualConfirmPayment
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentManualConfirmBodyDto'
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 'Admin: force-confirm a payment (bypass webhook)'
      tags:
        - payments
  /api/v1/payments/{id}:
    get:
      operationId: getPayment
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDto'
      security:
        - bearer: []
      summary: Get payment status
      tags:
        - payments
